
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>67</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: Arial, Helvetica, sans-serif;
    }

    .number {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: min(75vw, 75dvh, 70rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.07em;
      pointer-events: none;
      user-select: none;
    }

    .music-button {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 2;
      width: clamp(90px, 18vw, 150px);
      aspect-ratio: 1;
      padding: 0;
      border: 3px solid white;
      border-radius: 12px;
      background: #181818;
      overflow: hidden;
      cursor: pointer;
    }

    .music-button img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .music-button:focus-visible {
      outline: 3px solid #7dd3fc;
      outline-offset: 4px;
    }

    .hint {
      position: absolute;
      z-index: 1;
      top: 28px;
      left: clamp(120px, 23vw, 180px);
      color: #fff;
      font-weight: 900;
      font-size: clamp(12px, 2.6vw, 20px);
      line-height: 1.35;
      max-width: 190px;
      pointer-events: none;
    }

    .arrows {
      display: block;
      font-size: clamp(28px, 6vw, 46px);
      line-height: 1;
      margin-top: 8px;
      margin-left: -18px;
      transform: rotate(-12deg);
      transform-origin: left center;
    }

    @media (max-width: 380px) {
      .music-button {
        top: 12px;
        left: 12px;
        width: 86px;
      }

      .hint {
        top: 18px;
        left: 108px;
        max-width: 150px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <main class="number">67</main>

  <div class="hint" id="hint">
    CLICK HERE FORGOATEDS MUSIC
    <span class="arrows" aria-hidden="true">↙ ←</span>
  </div>

  <button
    class="music-button"
    id="musicButton"
    aria-label="Play singing frog"
    aria-pressed="false"
  >
    <img id="frogImage" src="frog-before.png" alt="Play singing frog">
  </button>

  <audio id="music" src="music.mp3" loop preload="auto"></audio>

  <script>
    const button = document.getElementById("musicButton");
    const image = document.getElementById("frogImage");
    const music = document.getElementById("music");
    const hint = document.getElementById("hint");

    let playing = false;

    button.addEventListener("click", async () => {
      if (!playing) {
        try {
          await music.play();

          playing = true;
          image.src = "frog-after.png";
          button.setAttribute("aria-pressed", "true");
          button.setAttribute("aria-label", "Stop singing frog");
          hint.style.display = "none";
        } catch (error) {
          alert("Music could not play. Check that music.mp3 is uploaded correctly.");
        }
      } else {
        music.pause();
        music.currentTime = 0;
        playing = false;
        image.src = "frog-before.png";
        button.setAttribute("aria-pressed", "false");
        button.setAttribute("aria-label", "Play singing frog");
        hint.style.display = "block";
      }
    });
  </script>
</body>
</html>
